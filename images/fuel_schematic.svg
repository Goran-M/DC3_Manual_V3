<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" width="1500" height="1000" font-family="'Helvetica Neue', Arial, sans-serif" fill="#2c2c2c">
  <title>LES DC-3 fuel system as simulated: four tanks, two selectors, and the feed to each engine</title>
  <desc>Simplified block diagram of the simulated DC-3 fuel system. Four centre-wing tanks across the top: left auxiliary (No. 4, 200 US gal), left main (No. 3, 202), right main (No. 2, 202) and right auxiliary (No. 1, 200), each with a sump drain and a 2 psi gravity head at its outlet. Each tank feeds a header that reaches both engine selectors, so either engine can draw from any tank; that is the crossfeed. Each selector has five positions: OFF, L AUX, L MAIN, R MAIN, R AUX. From each selector the line runs through a strainer with a bowl drain, which can drop up to 8 psi when fouled and starve the engine when iced; an electric boost pump at 21 psi, switched on the overhead panel behind a 15 A breaker; the firewall shutoff valve; the engine-driven pump at about 20 psi; and the carburettor to the engine. The fuel pressure gauge reads the carburettor chamber, 14 to 16 psi in normal running, about 7 at idle, 21 with the boost pump alone, with a warning light below 6 psi. The primer solenoid taps the line after the engine pump and feeds the cylinders. Each carburettor returns 5 to 10 gallons an hour of vapour and fuel to the main tank on its side, so an auxiliary drains faster than the burn while its main gains, and a full main vents the return overboard. An engine cannot start on the 2 psi gravity head; the boost pump is needed. A low fuel light comes on when either selected tank falls below 50 US gal. The cabin heater burns fuel from the right main tank. One fuel quantity gauge serves all four tanks through a four-position knob.</desc>
  <defs>
    <style>
      .t  { font-size: 19px; }
      .tb { font-size: 19px; font-weight: 700; }
      .s  { font-size: 15px; fill: #4b5563; }
      .sb { font-size: 15px; font-weight: 700; }
      .lbl { font-size: 14px; fill: #4b5563; }
      .tank { fill: #f3f0ea; stroke: #2c3e50; stroke-width: 2.5; }
      .dev { fill: #ffffff; stroke: #2c3e50; stroke-width: 2; }
      .fuel { stroke: #2c3e50; stroke-width: 3; fill: none; }
      .fuelT { stroke: #2c3e50; stroke-width: 2; fill: none; }
      .drain { stroke: #6b7280; stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
      .tap { stroke: #6b7280; stroke-width: 1.5; fill: none; stroke-dasharray: 3 4; }
      .heat { stroke: #7a5a0a; stroke-width: 2.5; fill: none; }
      .warn { fill: #c0392b; }
      .warnT { font-size: 14px; fill: #c0392b; font-style: italic; }
      .dot { fill: #2c3e50; }
    </style>
  </defs>

  <rect x="0" y="0" width="1500" height="1000" fill="#faf9f6"/>

  <!-- ══════════════ TANKS ══════════════ -->
  <rect class="tank" x="90"   y="50" width="250" height="100" rx="8"/>
  <text class="tb" x="215"  y="80" text-anchor="middle">LEFT AUXILIARY</text>
  <text class="s"  x="215"  y="102" text-anchor="middle">No. 4, left rear · 200 US gal</text>
  <text class="s"  x="215"  y="122" text-anchor="middle">2 psi gravity head at the outlet,</text>
  <text class="s"  x="215"  y="140" text-anchor="middle">not enough to start an engine</text>
  <rect class="tank" x="420"  y="50" width="250" height="100" rx="8"/>
  <text class="tb" x="545"  y="80" text-anchor="middle">LEFT MAIN</text>
  <text class="s"  x="545"  y="102" text-anchor="middle">No. 3, left front · 202 US gal</text>
  <text class="s"  x="545"  y="122" text-anchor="middle">start and land on the mains</text>
  <text class="s"  x="545"  y="140" text-anchor="middle">takes the vapour return</text>
  <rect class="tank" x="750"  y="50" width="250" height="100" rx="8"/>
  <text class="tb" x="875"  y="80" text-anchor="middle">RIGHT MAIN</text>
  <text class="s"  x="875"  y="102" text-anchor="middle">No. 2, right front · 202 US gal</text>
  <text class="s"  x="875"  y="122" text-anchor="middle">takes the vapour return</text>
  <text class="s"  x="875"  y="140" text-anchor="middle">also feeds the cabin heater</text>
  <rect class="tank" x="1080" y="50" width="250" height="100" rx="8"/>
  <text class="tb" x="1205" y="80" text-anchor="middle">RIGHT AUXILIARY</text>
  <text class="s"  x="1205" y="102" text-anchor="middle">No. 1, right rear · 200 US gal</text>
  <text class="s"  x="1205" y="122" text-anchor="middle">burn the auxiliaries in cruise,</text>
  <text class="s"  x="1205" y="140" text-anchor="middle">after half an hour on the mains</text>

  <!-- sump drains: one per tank, from a corner so the outlet line stays clear -->
  <g class="lbl">
    <path class="drain" d="M120 150 V172"/><path d="M112 172 H128 L120 184 Z" fill="#6b7280"/><text x="134" y="184">sump drain</text>
    <path class="drain" d="M450 150 V172"/><path d="M442 172 H458 L450 184 Z" fill="#6b7280"/><text x="464" y="184">sump drain</text>
    <path class="drain" d="M780 150 V172"/><path d="M772 172 H788 L780 184 Z" fill="#6b7280"/><text x="794" y="184">sump drain</text>
    <path class="drain" d="M1110 150 V172"/><path d="M1102 172 H1118 L1110 184 Z" fill="#6b7280"/><text x="1124" y="184">sump drain</text>
  </g>
  <text class="lbl" x="1490" y="208" text-anchor="end">water collects in the sumps; drain them from the STATUS tab</text>

  <!-- ══════════════ TANK HEADERS: any tank to either selector ══════════════ -->
  <!-- outlets down to each tank's header -->
  <line class="fuel" x1="215"  y1="150" x2="215"  y2="230"/>
  <line class="fuel" x1="545"  y1="150" x2="545"  y2="260"/>
  <line class="fuel" x1="875"  y1="150" x2="875"  y2="290"/>
  <line class="fuel" x1="1205" y1="150" x2="1205" y2="320"/>
  <!-- headers -->
  <line class="fuel" x1="215"  y1="230" x2="1130" y2="230"/>
  <line class="fuel" x1="370"  y1="260" x2="1150" y2="260"/>
  <line class="fuel" x1="390"  y1="290" x2="1380" y2="290"/>
  <line class="fuel" x1="410"  y1="320" x2="1205" y2="320"/>
  <text class="lbl" x="1136" y="225" text-anchor="start">L AUX header</text>
  <text class="lbl" x="1156" y="255" text-anchor="start">L MAIN header</text>
  <text class="lbl" x="1386" y="285" text-anchor="start">R MAIN</text>
  <text class="lbl" x="1211" y="315" text-anchor="start">R AUX header</text>
  <!-- junction dots where the outlets meet their headers -->
  <circle class="dot" cx="215" cy="230" r="4.5"/><circle class="dot" cx="545" cy="260" r="4.5"/>
  <circle class="dot" cx="875" cy="290" r="4.5"/><circle class="dot" cx="1205" cy="320" r="4.5"/>

  <!-- taps to the LEFT selector at x 370..430 (dots = connected; a crossing without a dot is not) -->
  <line class="fuelT" x1="370" y1="230" x2="370" y2="380"/><circle class="dot" cx="370" cy="230" r="4.5"/>
  <line class="fuelT" x1="390" y1="260" x2="390" y2="380"/><circle class="dot" cx="390" cy="260" r="4.5"/>
  <line class="fuelT" x1="410" y1="290" x2="410" y2="380"/><circle class="dot" cx="410" cy="290" r="4.5"/>
  <line class="fuelT" x1="430" y1="320" x2="430" y2="380"/><circle class="dot" cx="430" cy="320" r="4.5"/>
  <!-- taps to the RIGHT selector at x 1070..1130 -->
  <line class="fuelT" x1="1070" y1="230" x2="1070" y2="380"/><circle class="dot" cx="1070" cy="230" r="4.5"/>
  <line class="fuelT" x1="1090" y1="260" x2="1090" y2="380"/><circle class="dot" cx="1090" cy="260" r="4.5"/>
  <line class="fuelT" x1="1110" y1="290" x2="1110" y2="380"/><circle class="dot" cx="1110" cy="290" r="4.5"/>
  <line class="fuelT" x1="1130" y1="320" x2="1130" y2="380"/><circle class="dot" cx="1130" cy="320" r="4.5"/>

  <!-- ══════════════ SELECTORS ══════════════ -->
  <rect class="dev" x="320" y="380" width="160" height="70" rx="8"/>
  <text class="sb" x="400" y="404" text-anchor="middle">LEFT ENGINE</text>
  <text class="sb" x="400" y="422" text-anchor="middle">FUEL SELECTOR</text>
  <text class="lbl" x="400" y="441" text-anchor="middle">OFF · L AUX · L MAIN · R MAIN · R AUX</text>
  <rect class="dev" x="1020" y="380" width="160" height="70" rx="8"/>
  <text class="sb" x="1100" y="404" text-anchor="middle">RIGHT ENGINE</text>
  <text class="sb" x="1100" y="422" text-anchor="middle">FUEL SELECTOR</text>
  <text class="lbl" x="1100" y="441" text-anchor="middle">OFF · L AUX · L MAIN · R MAIN · R AUX</text>
  <text class="lbl" x="400" y="470" text-anchor="middle">cable-operated, on the cockpit floor</text>
  <text class="lbl" x="1100" y="470" text-anchor="middle">cable-operated, on the cockpit floor</text>

  <!-- crossfeed and low-fuel notes between the selectors -->
  <text class="t"  x="750" y="395" text-anchor="middle">Any tank to either engine.</text>
  <text class="s"  x="750" y="417" text-anchor="middle">Crossfeed is the selectors; there is no separate valve.</text>
  <rect x="640" y="440" width="220" height="46" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <circle class="warn" cx="662" cy="463" r="7"/>
  <text class="sb" x="678" y="459" fill="#c0392b">LOW FUEL light</text>
  <text class="lbl" x="678" y="477">either selected tank under 50 US gal</text>

  <!-- ══════════════ LEFT ENGINE FEED ══════════════ -->
  <line class="fuel" x1="400" y1="450" x2="400" y2="500"/>
  <rect class="dev" x="330" y="500" width="140" height="48" rx="6"/>
  <text class="sb" x="400" y="520" text-anchor="middle">STRAINER</text>
  <text class="s"  x="400" y="538" text-anchor="middle">bowl drain below</text>
  <path class="drain" d="M470 524 H500 V548"/><path d="M492 548 H508 L500 560 Z" fill="#6b7280"/>
  <text class="lbl" x="512" y="558">strainer drain</text>
  <text class="lbl" x="512" y="576">fouled: up to 8 psi lost</text>
  <text class="lbl" x="512" y="594">iced: the engine starves</text>
  <line class="fuel" x1="400" y1="548" x2="400" y2="600"/>
  <rect class="dev" x="330" y="600" width="140" height="48" rx="6"/>
  <text class="sb" x="400" y="620" text-anchor="middle">BOOST PUMP</text>
  <text class="s"  x="400" y="638" text-anchor="middle">electric · 21 psi</text>
  <text class="lbl" x="322" y="620" text-anchor="end">overhead switch, 15 A;</text>
  <text class="lbl" x="322" y="638" text-anchor="end">needed to start</text>
  <line class="fuel" x1="400" y1="648" x2="400" y2="690"/>
  <!-- firewall valve glyph: a bow-tie -->
  <path d="M386 690 L414 714 L414 690 L386 714 Z" fill="#fff" stroke="#2c3e50" stroke-width="2"/>
  <text class="sb" x="424" y="707" text-anchor="start">FIREWALL SHUTOFF</text>
  <text class="lbl" x="424" y="724" text-anchor="start">open in normal running</text>
  <line class="fuel" x1="400" y1="714" x2="400" y2="750"/>
  <rect class="dev" x="330" y="750" width="140" height="48" rx="6"/>
  <text class="sb" x="400" y="770" text-anchor="middle">ENGINE-DRIVEN</text>
  <text class="sb" x="400" y="788" text-anchor="middle">PUMP · 20 psi</text>
  <line class="fuel" x1="400" y1="798" x2="400" y2="850"/>
  <circle class="dot" cx="400" cy="822" r="4.5"/>
  <!-- primer -->
  <line class="fuelT" x1="400" y1="822" x2="480" y2="822"/>
  <rect class="dev" x="480" y="806" width="120" height="32" rx="6"/>
  <text class="sb" x="540" y="827" text-anchor="middle">PRIMER</text>
  <path class="tap" d="M540 838 V905 H470"/>
  <text class="lbl" x="548" y="880" text-anchor="start">to the cylinders</text>
  <!-- pressure gauge, reading the carburettor chamber -->
  <path class="tap" d="M400 822 H320 V840"/>
  <circle cx="320" cy="862" r="22" fill="#fff" stroke="#2c3e50" stroke-width="2"/>
  <line x1="320" y1="862" x2="330" y2="848" stroke="#2c3e50" stroke-width="2"/>
  <text class="lbl" x="292" y="900" text-anchor="end">FUEL PRESSURE</text>
  <text class="lbl" x="292" y="917" text-anchor="end">14 to 16 psi running</text>
  <text class="lbl" x="292" y="934" text-anchor="end">7 at idle · 21 boost only</text>
  <circle class="warn" cx="170" cy="951" r="6"/>
  <text class="warnT" x="180" y="956">light below 6 psi</text>
  <rect class="dev" x="330" y="850" width="140" height="48" rx="6"/>
  <text class="sb" x="400" y="870" text-anchor="middle">CARBURETTOR</text>
  <text class="s"  x="400" y="888" text-anchor="middle">vapour return to L MAIN</text>
  <line class="fuel" x1="400" y1="898" x2="400" y2="930"/>
  <rect x="320" y="930" width="160" height="50" rx="8" fill="#2c3e50"/>
  <text x="400" y="951" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">LEFT ENGINE</text>
  <text x="400" y="970" text-anchor="middle" fill="#fff" font-size="14">R-1830 Twin Wasp</text>

  <!-- ══════════════ RIGHT ENGINE FEED (mirror, primer and gauge to the right) ══════════════ -->
  <line class="fuel" x1="1100" y1="450" x2="1100" y2="500"/>
  <rect class="dev" x="1030" y="500" width="140" height="48" rx="6"/>
  <text class="sb" x="1100" y="520" text-anchor="middle">STRAINER</text>
  <text class="s"  x="1100" y="538" text-anchor="middle">bowl drain below</text>
  <path class="drain" d="M1030 524 H1000 V548"/><path d="M992 548 H1008 L1000 560 Z" fill="#6b7280"/>
  <text class="lbl" x="988" y="558" text-anchor="end">strainer drain</text>
  <line class="fuel" x1="1100" y1="548" x2="1100" y2="600"/>
  <rect class="dev" x="1030" y="600" width="140" height="48" rx="6"/>
  <text class="sb" x="1100" y="620" text-anchor="middle">BOOST PUMP</text>
  <text class="s"  x="1100" y="638" text-anchor="middle">electric · 21 psi</text>
  <text class="lbl" x="1178" y="620" text-anchor="start">overhead switch, 15 A;</text>
  <text class="lbl" x="1178" y="638" text-anchor="start">needed to start</text>
  <line class="fuel" x1="1100" y1="648" x2="1100" y2="690"/>
  <path d="M1086 690 L1114 714 L1114 690 L1086 714 Z" fill="#fff" stroke="#2c3e50" stroke-width="2"/>
  <text class="sb" x="1076" y="707" text-anchor="end">FIREWALL SHUTOFF</text>
  <text class="lbl" x="1076" y="724" text-anchor="end">closes the fuel off in a fire</text>
  <line class="fuel" x1="1100" y1="714" x2="1100" y2="750"/>
  <rect class="dev" x="1030" y="750" width="140" height="48" rx="6"/>
  <text class="sb" x="1100" y="770" text-anchor="middle">ENGINE-DRIVEN</text>
  <text class="sb" x="1100" y="788" text-anchor="middle">PUMP · 20 psi</text>
  <line class="fuel" x1="1100" y1="798" x2="1100" y2="850"/>
  <circle class="dot" cx="1100" cy="822" r="4.5"/>
  <line class="fuelT" x1="1100" y1="822" x2="1180" y2="822"/>
  <rect class="dev" x="1180" y="806" width="120" height="32" rx="6"/>
  <text class="sb" x="1240" y="827" text-anchor="middle">PRIMER</text>
  <path class="tap" d="M1240 838 V905 H1170"/>
  <text class="lbl" x="1248" y="880" text-anchor="start">to the cylinders</text>
  <path class="tap" d="M1100 822 H1020 V840"/>
  <circle cx="1020" cy="862" r="22" fill="#fff" stroke="#2c3e50" stroke-width="2"/>
  <line x1="1020" y1="862" x2="1030" y2="848" stroke="#2c3e50" stroke-width="2"/>
  <text class="lbl" x="992" y="900" text-anchor="end">FUEL PRESSURE</text>
  <text class="lbl" x="992" y="917" text-anchor="end">reads the carburettor chamber,</text>
  <text class="lbl" x="992" y="934" text-anchor="end">not the pump</text>
  <rect class="dev" x="1030" y="850" width="140" height="48" rx="6"/>
  <text class="sb" x="1100" y="870" text-anchor="middle">CARBURETTOR</text>
  <text class="s"  x="1100" y="888" text-anchor="middle">vapour return to R MAIN</text>
  <line class="fuel" x1="1100" y1="898" x2="1100" y2="930"/>
  <rect x="1020" y="930" width="160" height="50" rx="8" fill="#2c3e50"/>
  <text x="1100" y="951" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">RIGHT ENGINE</text>
  <text x="1100" y="970" text-anchor="middle" fill="#fff" font-size="14">R-1830 Twin Wasp</text>

  <!-- ══════════════ CABIN HEATER, from the right main header ══════════════ -->
  <path class="heat" d="M1380 290 V560 H1330"/>
  <circle cx="1380" cy="290" r="4.5" fill="#7a5a0a"/>
  <rect x="1200" y="535" width="130" height="50" rx="6" fill="#fff" stroke="#7a5a0a" stroke-width="2"/>
  <text class="sb" x="1265" y="556" text-anchor="middle" fill="#7a5a0a">CABIN HEATER</text>
  <text class="lbl" x="1265" y="574" text-anchor="middle">combustion, on the right main</text>

  <!-- ══════════════ QUANTITY GAUGE ══════════════ -->
  <rect class="dev" x="1350" y="50" width="140" height="100" rx="8"/>
  <circle cx="1420" cy="78" r="17" fill="#fff" stroke="#2c3e50" stroke-width="2"/>
  <line x1="1420" y1="78" x2="1431" y2="67" stroke="#2c3e50" stroke-width="2"/>
  <text class="sb" x="1420" y="112" text-anchor="middle">FUEL QUANTITY</text>
  <text class="lbl" x="1420" y="128" text-anchor="middle">one gauge,</text>
  <text class="lbl" x="1420" y="143" text-anchor="middle">four-position knob</text>

  <!-- ══════════════ LEGEND ══════════════ -->
  <g transform="translate(625 615)">
    <rect x="0" y="0" width="240" height="150" rx="6" fill="#fff" stroke="#d1d5db"/>
    <line class="fuel" x1="14" y1="22" x2="58" y2="22"/><text class="s" x="68" y="27">fuel line</text>
    <line class="tap" x1="14" y1="46" x2="58" y2="46"/><text class="s" x="68" y="51">gauge or primer tap</text>
    <line class="drain" x1="14" y1="70" x2="58" y2="70"/><text class="s" x="68" y="75">drain</text>
    <circle class="dot" cx="36" cy="94" r="4.5"/><text class="s" x="68" y="99">dot: lines joined</text>
    <line class="fuelT" x1="28" y1="112" x2="44" y2="126"/><line class="fuelT" x1="28" y1="126" x2="44" y2="112"/><text class="s" x="68" y="123">crossing: not joined</text>
    <text class="lbl" x="14" y="143">Simplified, as simulated. Chapter 8.</text>
  </g>
</svg>
